<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda de crochet</title>
<meta name="theme-color" content="#fffdff">
<link rel="icon" href="/img/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
{{META}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css?v=20">
</head>
<body>

<a class="saltar-al-contenido" href="#piezas">Saltar a las piezas</a>


<!-- Desenfoque progresivo bajo la cabecera: el contenido se disuelve
     al pasar por debajo en vez de cortarse contra un canto duro. -->
<div class="desenfoque" aria-hidden="true"><div></div><div></div><div></div></div>

<!-- El cursor nombra la acción antes de que haya que adivinarla. -->
<div class="cursor" id="cursor" aria-hidden="true">
  <span class="cursor__punto"></span>
  <span class="cursor__texto" id="cursorTexto"></span>
</div>

<header class="cabecera">
  <div class="contenedor cabecera__fila">
    <a class="marca" href="#inicio" id="marca" data-cursor="ir">&nbsp;</a>
    <nav class="indice" aria-label="Índice">
      <a href="#piezas" data-cursor="ir">Piezas <span class="cuenta" id="cuentaIndice"></span></a>
      <a href="#contacto" data-cursor="ir">Contacto</a>
    </nav>
    <button class="menu-boton" id="menuBoton" aria-label="Abrir menú" aria-expanded="false" aria-controls="menuMovil">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="menu-movil" id="menuMovil" aria-label="Menú móvil">
    <a href="#piezas">Piezas</a>
    <a href="#contacto">Contacto</a>
  </nav>
</header>

<main id="inicio">

  <!-- ================= UMBRAL ================= -->
  <section class="umbral">
    <div class="umbral__centro">
      <svg class="umbral__nudo" viewBox="0 0 64 64" role="img" aria-label="Nudo">
        <circle cx="32" cy="32" r="18"/>
        <path d="M15 26c12 3 25 3 34 12M16 38c10-8 22-12 30-19M22 17c4 13 11 22 22 27"/>
        <path d="M50 32c6 2 8 7 6 12"/>
      </svg>
      <h1 class="umbral__marca" id="umbralMarca">{{MARCA}}</h1>
      <p class="umbral__pie" id="umbralPie">{{TAGLINE}}</p>
    </div>

    <div class="umbral__cuenta">
      <b id="umbralCuenta">—</b>
      <span id="umbralCuentaTexto">piezas en la colección</span>
    </div>

    <a class="umbral__baja" href="#piezas" data-cursor="ir">Recorrer</a>
  </section>

  <!-- ================= MANIFIESTO ================= -->
  <section class="manifiesto">
    <div class="contenedor">
      <p class="etiqueta aparece">El taller</p>
      <h2 class="manifiesto__texto aparece" style="--i:1" id="manifiestoTexto"></h2>
      <p class="manifiesto__nota aparece" style="--i:2" id="manifiestoNota"></p>
    </div>
  </section>

  <!-- ================= LAS PIEZAS =================
       Una escena fijada por pieza. Las arma el JS con lo que
       devuelve /api/site, para que el panel siga mandando. -->
  <div class="piezas" id="piezas">
    <div class="cargando" id="cargando">Cargando la colección…</div>
  </div>
</main>

<!-- ================= CIERRE ================= -->
<footer class="cierre" id="contacto">
  <div class="contenedor">
    <div class="pie__grid">
      <div>
        <div class="pie__marca" id="pieMarca"></div>
        <p id="pieTexto"></p>
      </div>
      <div>
        <h4>Escríbeme</h4>
        <ul class="pie__lista" id="pieContacto"></ul>
      </div>
      <div>
        <h4>El sitio</h4>
        <ul class="pie__lista">
          <li><a href="#piezas">Piezas</a></li>
          <li><a href="/legal.html#terminos">Términos y condiciones</a></li>
          <li><a href="/legal.html#devoluciones">Cambios y devoluciones</a></li>
          <li><a href="/legal.html#privacidad">Privacidad</a></li>
        </ul>
      </div>
    </div>
    <div class="pie__abajo">
      <span id="pieCopy"></span>
      <span id="pieFirma"></span>
    </div>
  </div>
</footer>

<!-- ================= UNIVERSO =================
     La ficha completa. Se abre desde la lámina y ocupa todo. -->
<div class="universo" id="universo" role="dialog" aria-modal="true" aria-labelledby="universoNombre">
  <button class="universo__cerrar" id="universoCerrar" aria-label="Cerrar">&times;</button>
  <div class="universo__caja" id="universoCaja"></div>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="/js/site.js?v=13"></script>
</body>
</html>
